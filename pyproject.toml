[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "weekly-intel"
version = "0.1.0"
description = "Automated research-intelligence collection pipeline"
requires-python = ">=3.11"
dependencies = ["PyYAML>=6.0.2"]

[project.scripts]
weekly-intel = "weekly_intel.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
