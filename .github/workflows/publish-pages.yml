name: Publish approved report to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/publish-pages.yml"
      - "site/**"
  workflow_dispatch:
    inputs:
      confirm:
        description: "输入 publish 确认发布当前 approved 周报"
        required: true
        type: string
      issue:
        description: "批准时锁定的 ISO 周，例如 2026-W30"
        required: false
        type: string
      department:
        description: "部门 ID，例如 orbitinfer"
        required: false
        type: string

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  verify:
    if: ${{ github.event_name == 'push' || inputs.confirm == 'publish' }}
    runs-on: ubuntu-latest
    outputs:
      issue: ${{ steps.issue.outputs.issue }}
    steps:
      - uses: actions/checkout@v4

      - id: issue
        name: Verify researcher approval
        shell: bash
        run: |
          node - <<'NODE'
          const data = require("./site/app/department-data.json");
          const reports = data.departments.flatMap((department) =>
            department.archive.map((report) => ({ department, report })),
          );
          const approved = reports.filter(({ department, report }) =>
            report.issue.status === "approved" &&
            (!process.env.EXPECTED_DEPARTMENT ||
              department.id === process.env.EXPECTED_DEPARTMENT) &&
            (!process.env.EXPECTED_ISSUE ||
              report.issue.isoWeek === process.env.EXPECTED_ISSUE),
          );
          if (!approved.length) {
            throw new Error("Refusing publication: no matching approved report");
          }
          const { department, report } = approved[0];
          const fs = require("node:fs");
          fs.appendFileSync(
            process.env.GITHUB_OUTPUT,
            `issue=${department.id}/${report.issue.isoWeek}\n`,
          );
          NODE
        env:
          EXPECTED_ISSUE: ${{ inputs.issue }}
          EXPECTED_DEPARTMENT: ${{ inputs.department }}

  build:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: Build static review snapshot
        working-directory: site
        run: |
          npm ci
          node scripts/prepare-public-data.mjs
          npm run export:pages
          node --test tests/rendered-html.test.mjs

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v4
        with:
          path: site/out

  deploy:
    needs: [verify, build]
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy approved snapshot
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Verify deployed CSS
        shell: bash
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          node - <<'NODE'
          const delay = (milliseconds) =>
            new Promise((resolve) => setTimeout(resolve, milliseconds));

          for (let attempt = 1; attempt <= 6; attempt += 1) {
            const pageUrl = new URL(process.env.PAGE_URL);
            pageUrl.searchParams.set("smoke", `${Date.now()}-${attempt}`);
            const page = await fetch(pageUrl, { cache: "no-store" });
            const html = await page.text();
            const cssPath = html.match(/href="([^"]+\.css)"/)?.[1];
            const cssUrl = cssPath
              ? new URL(cssPath, pageUrl).href
              : null;
            const css = cssUrl
              ? await fetch(`${cssUrl}?smoke=${Date.now()}`, {
                  cache: "no-store",
                })
              : null;

            if (page.ok && css?.ok) {
              console.log(`Verified ${cssUrl}`);
              process.exit(0);
            }

            console.error(
              `Attempt ${attempt}: page=${page.status}, css=${css?.status ?? "missing"}`,
            );
            if (attempt < 6) await delay(5000);
          }

          throw new Error("Deployed page did not load its CSS asset");
          NODE
