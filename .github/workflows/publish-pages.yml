name: Publish approved report to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "site/app/report-data.json"
      - "site/app/archive-data.json"
  workflow_dispatch:
    inputs:
      confirm:
        description: "输入 publish 确认发布当前 approved 周报"
        required: true
        type: string
      issue:
        description: "批准时锁定的 ISO 周，例如 2026-W30"
        required: false
        type: string

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  verify:
    if: ${{ github.event_name == 'push' || inputs.confirm == 'publish' }}
    runs-on: ubuntu-latest
    outputs:
      issue: ${{ steps.issue.outputs.issue }}
    steps:
      - uses: actions/checkout@v4

      - id: issue
        name: Verify researcher approval
        shell: bash
        run: |
          node - <<'NODE'
          const report = require("./site/app/report-data.json");
          if (report.issue.status !== "approved") {
            throw new Error(`Refusing publication: issue status is ${report.issue.status}`);
          }
          if (
            process.env.EXPECTED_ISSUE &&
            report.issue.isoWeek !== process.env.EXPECTED_ISSUE
          ) {
            throw new Error(
              `Refusing publication: expected ${process.env.EXPECTED_ISSUE}, found ${report.issue.isoWeek}`,
            );
          }
          const fs = require("node:fs");
          fs.appendFileSync(
            process.env.GITHUB_OUTPUT,
            `issue=${report.issue.isoWeek}\n`,
          );
          NODE
        env:
          EXPECTED_ISSUE: ${{ inputs.issue }}

  build:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: Build static review snapshot
        working-directory: site
        run: |
          npm ci
          node scripts/prepare-public-data.mjs
          npm run export:pages

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v4
        with:
          path: site/out

  deploy:
    needs: [verify, build]
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy approved snapshot
        id: deployment
        uses: actions/deploy-pages@v4
