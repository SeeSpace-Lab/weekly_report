name: Build weekly intelligence report

on:
  workflow_dispatch:
  schedule:
    - cron: "0 1 * * 1"

permissions:
  contents: write

jobs:
  weekly:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - uses: actions/cache@v4
        with:
          path: data/weekly_intel.db
          key: weekly-intel-db-${{ github.run_id }}
          restore-keys: |
            weekly-intel-db-

      - name: Install
        run: python -m pip install -e .

      - name: Collect, assess and render
        env:
          OPENREVIEW_TOKEN: ${{ secrets.OPENREVIEW_TOKEN }}
          GITHUB_TOKEN: ${{ github.token }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          WECHAT_FEED_BASE_URL: ${{ vars.WECHAT_FEED_BASE_URL }}
          WECHAT_FEED_AUTH_TOKEN: ${{ secrets.WECHAT_FEED_AUTH_TOKEN }}
          WEEKLY_LLM_API_KEY: ${{ secrets.WEEKLY_LLM_API_KEY }}
          WEEKLY_LLM_BASE_URL: ${{ vars.WEEKLY_LLM_BASE_URL }}
          WEEKLY_LLM_MODEL: ${{ vars.WEEKLY_LLM_MODEL }}
          WEEKLY_FETCH_FULLTEXT: "1"
        run: weekly-intel run-weekly --days 7

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: Verify web report
        working-directory: site
        run: |
          npm ci
          npm run build

      - name: Commit generated report and audit
        run: |
          git config user.name "weekly-intel-bot"
          git config user.email "weekly-intel-bot@users.noreply.github.com"
          git add outputs runs site/app/report-data.json
          git diff --cached --quiet || git commit -m "chore: generate weekly intelligence report"
          git push
