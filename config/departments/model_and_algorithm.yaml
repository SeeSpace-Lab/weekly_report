department_id: model_and_application
name: 模型应用
version: "0.1"
enabled: true
timezone: Asia/Shanghai

page:
  order: 3
  slug: model_and_application
  brand_mark: MA
  eyebrow: MODEL AND APPLICATION WEEKLY
  headline:
    - 基础模型
    - Agent
    - 数据压缩
  description: 跟踪模型、Agent、数据压缩方向的研究进展。

owners:
  content_owner: 李文硕
  github_team: weekly-report-reviewers
  reviewer_label: model-and-algorithm-review

mission: >-
  跟踪基础语言大模型、多模态大模型以及遥感领域大模型的技术发展，包括数据、评测、模型架构、训练方法以及著名大模型公司的相关信息，
  跟踪通用Agent架构、遥感/地质Agent设计方法，数据压缩技术发展。

core_topics:
  - id: token_compression
    label: Token压缩
    weight: 1.0
    section: primary_topic
    keywords:
      - token compression
      - token reduction
      - token merging
      - token压缩
  - id: compression_for_llm
    label: 压缩模型结合
    weight: 1.0
    section: primary_topic
    keywords:
      - compressed video representation
      - compressed video understanding
      - codec aware video language model
      - video codec representation
      - compressed domain inference
  - id: semantic_compression
    label: 语义压缩
    weight: 1.0
    section: primary_topic
    keywords:
      - task-driven compression
      - semantic compression
      - video coding for machine
      - image coding for machine
      - feature compression
      - latent representation compression
  - id: vision_language_model
    label: 多模态模型
    weight: 1.0
    section: primary_topic
    keywords:
      - VLM
      - vision language model
      - multimodal large language model
      - vision transformer
  - id: remote_sensing_model
    label: 遥感大模型
    weight: 1.0
    section: primary_topic
    keywords:
      - remote sensing VLM
      - remote sensing agent
  - id: AI4S
    label: AI4S
    weight: 1.0
    section: primary_topic
    keywords:
      - AI for drug discovery
      - protein language model
      - AIDD
      - generative models for protein
  - id: remote_sensing_compression
    label: 遥感压缩
    weight: 0.95
    section: secondary_topic
    keywords:
      - AI remote sensing compression
      - learned remote sensing compression
      - end-to-end remote sensing compression
      - AI遥感压缩
  - id: video_compression
    label: 视频压缩
    weight: 0.9
    section: secondary_topic
    keywords:
      - end-to-end video compression
      - AI video compression
      - learned video compression
      - AI视频压缩
  - id: image_compression
    label: 图像压缩
    weight: 0.9
    section: secondary_topic
    keywords:
      - end-to-end image compression
      - AI image compression
      - learned image compression
      - AI图像压缩


adjacent_topics:
  - 只有在能改变本部门架构、指标或实验方案时才纳入的邻近方向

