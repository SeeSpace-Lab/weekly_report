# 可填写具体论文标题，或需要持续跟踪的精确查询短语。
# 命中清单会提高部门相关性，但仍必须满足本周有更新和证据充分。
paper_watchlist: []

# 只引用 config/sources.yaml 中已经注册的 source_id。
# 新公众号必须先在共享来源目录和 WeRSS 中完成一次技术接入。
source_pool:
  papers:
    - arxiv
    - openreview
    - crossref
  venues:
    - venue_official_pages
  repositories: []
  models_and_datasets:
    - huggingface_hub
  wechat:
    - wechat_paperweekly
  manual:
    - manual_inbox
  overrides:
    arxiv:
      categories:
        - cs.AI
        - cs.CL
        - cs.CV
        - cs.LG
        - cs.IR
        - cs.MM
        - eess.IV
        - eess.SP
        - q-bio.BM
        - q-bio.QM
      search_terms:
        - vision language model
        - multimodal large language model
        - vision language agent
        - multimodal agent
        - large language model agent
        - VLM compression
        - visual token compression
        - token pruning
        - token merging
        - semantic compression
        - learned image compression
        - learned video compression
        - video coding for machines
        - image coding for machines
        - compressed domain inference
        - remote sensing foundation model
        - remote sensing vision language model
        - remote sensing agent
        - protein language model
        - protein foundation model
        - generative model for protein
        - AI for drug discovery
      max_results: 200
      search_terms_per_query: 4
      request_delay_seconds: 3
    openreview:
      venues:
        - venue_id: ICLR.cc/2026/Conference
          venue: ICLR
          year: 2026

ranking:
  global_importance:
    venue_or_review_status: 0.20
    system_novelty: 0.20
    evidence_and_reproducibility: 0.20
    trend_signal: 0.15
    artifact_value: 0.15
    version_significance: 0.10

weekly_output:
  target_read_minutes: 30
  min_items: 8
  max_items: 8
  max_wechat_items: 3
  wechat_candidate_reserve: 8
  must_read_min: 3
  must_read_max: 5
  deep_read_min: 8
  deep_read_max: 12
  quick_scan_min: 10
  quick_scan_max: 20
  sections:
    - weekly_trends
    - must_read
    - primary_topic
    - secondary_topic
    - frameworks_benchmarks_datasets
    - department_relevance
  section_labels:
    must_read: 本周必读
    primary_topic: 核心主题
    secondary_topic: 次核心主题
    frameworks_benchmarks_datasets: 框架、Benchmark 与数据集
    department_relevance: 部门专项意义

activation_requirements:
  - 部门使命和近期研究决策已确认
  - 核心主题、邻近主题和排除边界已确认
  - 论文来源、检索式、重点会场和公众号已确认
  - 内容负责人和 GitHub 发布审核团队已确认
