# 可填写具体论文标题，或需要持续跟踪的精确查询短语。
# 命中清单会提高部门相关性，但仍必须满足本周有更新和证据充分。
paper_watchlist:
  - query: "visual token compression vision language model"
    reason: 跟踪多模态模型的视觉 Token 压缩、选择、剪枝和合并
  - query: "codec native multimodal foundation model"
    reason: 跟踪压缩域表征与多模态基础模型结合
  - query: "remote sensing vision language model agent"
    reason: 跟踪遥感大模型与遥感智能体
  - query: "AI for science foundation model protein language model"
    reason: 跟踪 AI4S 与蛋白质语言模型

# 只引用 config/sources.yaml 中已经注册的 source_id。
# 新公众号必须先在共享来源目录和 WeRSS 中完成一次技术接入。
source_pool:
  papers:
    - arxiv
    - openreview
    - crossref
  venues:
    - venue_official_pages
  repositories: []
  models_and_datasets:
    - huggingface_hub
  wechat:
    - wechat_paperweekly
  manual:
    - manual_inbox
  overrides:
    arxiv:
      categories: [cs.CL, cs.CV, cs.AI, cs.LG, cs.MM, cs.IR, eess.IV]
      search_terms:
        - visual token compression
        - visual token pruning vision language model
        - token merging multimodal large language model
        - compressed domain vision language model
        - codec native multimodal model
        - multimodal large language model
        - large language model agent architecture
        - multimodal agent
        - remote sensing foundation model
        - remote sensing vision language model
        - geospatial agent
        - AI for science foundation model
        - protein language model
        - learned image compression
        - learned video compression
        - semantic compression for machines
    crossref:
      search_terms:
        - visual token compression vision language model
        - multimodal large language model
        - large language model agent architecture
        - remote sensing foundation model
        - AI for science foundation model
        - protein language model
        - learned image compression
        - learned video compression
      rows_per_query: 100
    huggingface_hub:
      search_terms:
        - multimodal large language model
        - vision language model
        - remote sensing foundation model
        - protein language model
        - image compression
        - video compression
    openreview:
      venues:
        - venue_id: ICLR.cc/2026/Conference
          venue: ICLR
          year: 2026

ranking:
  global_importance:
    venue_or_review_status: 0.20
    system_novelty: 0.20
    evidence_and_reproducibility: 0.20
    trend_signal: 0.15
    artifact_value: 0.15
    version_significance: 0.10

candidate_policy:
  allow_strong_new_preprints: true
  min_strong_new_preprint_relevance: 0.65
  read_minutes:
    strong_new_preprint: 3.0

weekly_output:
  target_read_minutes: 30
  max_items: 8
  max_wechat_items: 3
  wechat_candidate_reserve: 8
  must_read_min: 3
  must_read_max: 5
  deep_read_min: 8
  deep_read_max: 12
  quick_scan_min: 10
  quick_scan_max: 20
  sections:
    - weekly_trends
    - must_read
    - primary_topic
    - secondary_topic
    - frameworks_benchmarks_datasets
    - department_relevance
  section_labels:
    must_read: 本周必读
    primary_topic: 核心主题
    secondary_topic: 次核心主题
    frameworks_benchmarks_datasets: 框架、Benchmark 与数据集
    department_relevance: 部门专项意义

activation_requirements:
  - 部门使命和近期研究决策已确认
  - 核心主题、邻近主题和排除边界已确认
  - 论文来源、检索式、重点会场和公众号已确认
  - 内容负责人和 GitHub 发布审核团队已确认
