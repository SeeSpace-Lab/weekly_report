  headline:
    - 星座智算
    - 仿真平台
  description: >-
    跟踪 L2 密集编队、L3 星座级服务组织与 OrbitServe 仿真平台进展，
    为模型、实验、Runtime 和受约束 DSE 提供每周可核验的研究情报。

owners:
  content_owner: 郭立栋
  github_team: weekly-report-reviewers
  reviewer_label: constellation-simulation-review

mission: >-
  面向全球地面 ChatLLM Serving，跟踪星座级仿真、密集计算编队、
  Compute Cell 组织和轨道状态感知运行时研究。周报重点服务 OrbitServe
  仿真器模块设计、L2/L3 设计空间选择、实验基线、参数校准和论文差异性判断。
  轨道、通信、能源、散热与成本研究只有在能够改变系统约束、参数范围或实验结论时才纳入。

