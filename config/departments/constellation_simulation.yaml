    reason: 面向地区计算需求的计算星座构型设计近邻
  - query: "OrbitServe-VLM satellite cluster serving"
    reason: 固定密集卫星簇内的能量感知 VLM Serving 强近邻
  - query: "SpaceMoE satellite mixture of experts"
    reason: 固定星座上的模型与动态拓扑联合放置强近邻
  - query: "SkyMemory LEO KV cache"
    reason: 星间 KV 查找、迁移与重算边界的机制近邻
  - title: "Krios: Scheduling Abstractions and Mechanisms for Enabling a LEO Compute Cloud"
