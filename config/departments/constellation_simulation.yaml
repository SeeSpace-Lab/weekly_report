department_id: constellation_simulation
name: 星座智算仿真平台
version: "0.4"
enabled: true
status: active
timezone: Asia/Shanghai

page:
  order: 2
  slug: constellation-simulation
  brand_mark: CS
  eyebrow: CONSTELLATION COMPUTING SIMULATION
  headline:
    - 星座智算
    - 仿真平台
  description: >-
    跟踪 L2 密集编队、L3 星座级服务组织与 OrbitServe 仿真平台进展，
    为模型、实验、Runtime 和受约束 DSE 提供每周可核验的研究情报。

owners:
  content_owner: OrbitServe / OB3 研究组
  github_team: weekly-report-reviewers
  reviewer_label: constellation-simulation-review

mission: >-

  面向全球地面 ChatLLM Serving，跟踪星座级仿真、密集计算编队、
  Compute Cell 组织和轨道状态感知运行时研究。周报重点服务 OrbitServe
  仿真器模块设计、L2/L3 设计空间选择、实验基线、参数校准和论文差异性判断。
  轨道、通信、能源、散热与成本研究只有在能够改变系统约束、参数范围或实验结论时才纳入。

scope_boundary:
  primary_layers: [L2, L3]
  contextual_layers: [L1, L4]
  owns: 多星密集编队、Compute Cell 内协同，以及 Compute Cell 之间的星座级服务组织与 OrbitServe
  routing_rules:
    - 主要创新发生在单颗卫星内部的模型执行、KV、量化或批处理时，归属星载大模型推理引擎
    - 主要控制对象是多颗卫星、密集编队、Compute Cell 拓扑或跨星模型执行时，归属本部门 L2
    - 主要控制对象是 Compute Cell 之间的接入、路径、状态、调度或服务连续性时，归属本部门 L3
    - 同时跨越 L1 与 L2 时，按论文主要实验变量和核心贡献确定主板块，另一板块只写交叉影响，不重复精读
    - L4 轨道面与全球构型只用于理论定界和敏感性分析，不作为本部门全局搜索主体
  handoff_department: orbitinfer

project_positioning:
  target_service: 面向全球地面用户的 ChatLLM Serving
  current_label: 星座级高可信 ChatLLM Serving 仿真工具平台与系统研究
  supersedes:
    - two-timescale co-design
    - 把轨道构型与 Serving 策略做无边界全局联合搜索
  contributions:
    - id: high_fidelity_simulator
      statement: 构建高可信星座级 ChatLLM Serving 仿真工具平台，并明确模块、接口和校准方法
    - id: characterization
      statement: 刻画太空算力在什么条件下可行、瓶颈在哪里以及关键变量如何相互作用
    - id: orbit_aware_runtime
      statement: 设计面向轨道移动、卫星状态变化和服务连续性的 orbit-aware Runtime
    - id: constrained_l2_l3_dse
      statement: 在明确约束下开展 L2/L3 设计空间探索，形成 Cost-SLO 和系统设计结论
  l4_role: L4 只用于理论定界、上下界和小范围敏感性分析，不作为全局搜索主体

# 这些问题会进入 Codex 候选包，约束每周选稿和精读的判断方向。
research_questions:
  - 本周是否出现直接覆盖 L2 密集编队、Compute Cell 或 L3 星座级服务组织的新论文？
  - 新工作是否改变 OrbitServe 仿真器、Runtime、Characterization 或受约束 DSE 的设计？
  - 哪些变量、参数、数据集、代码或实测结果可以用于仿真校准和实验对比？
  - 新工作与 OrbitServe 最新四项 contribution 重叠在哪里，仍缺少什么？
  - 国内外研究机构或企业的新计划是否改变卫星规模、硬件、ISL、能源、散热或成本假设？
  - 国内微信公众号本周是否出现可回溯到论文、项目官网或正式公告的有价值线索？

# 当前定位以高可信仿真器、条件与瓶颈分析、orbit-oriented Runtime、
# 受约束 L2/L3 DSE 为准，不再使用 two-timescale co-design 作为主线。
content_requirements:
  require_content_and_judgment: true
  content_field: contentZh
  judgment_field: oneSentenceZh
  research_keyword_profile:
    required: true
    dimensions:
      - technicalDomains
      - architecturesOrModels
      - workloadsOrScenarios
      - otherKeywords
    derive_from:
      - abstract
      - introduction
      - method
      - full_text
    title_only_inference_forbidden: true
  publication_context:
    required: true
    status_values:
      - peer_reviewed_published
      - peer_reviewed_accepted
      - arxiv_preprint_only
      - publication_status_unclear
    published_or_accepted:
      fields:
        - venueFullName
        - venueType
        - publicationYear
        - ccfRating
        - venueLevelAssessment
        - venueAssessmentBasis
      rules:
        - 优先以会议或期刊官网、正式论文集、DBLP、Crossref 或 OpenReview 核验录用与发表状态
        - 给出会议或期刊全称、研究领域和大致层级；适用时标注 CCF A/B/C
        - CCF 未收录时写明“CCF 未收录”，再依据领域影响力、同行认可度和代表性论文给出谨慎对标
        - 不把作者自行填写的 arXiv comments 当成已经录用，除非能由会议或期刊一手页面交叉核验
    arxiv_preprint_only:
      fields:
        - authorAffiliations
        - seniorOrCorrespondingAuthors
        - verifiedHonors
        - representativeWorks
        - authorTrackRecordAssessment
        - identityEvidence
      rules:
        - 优先评估通讯作者、资深作者或项目负责人；必要时补充第一作者背景
        - 学校、机构、IEEE/ACM Fellow 等身份必须来自机构主页、学会名录或作者主页等可核验来源
        - 代表作需说明论文题目、发表 venue 和与当前工作的关系，不只罗列数量或引用数
        - 严格区分同名作者；无法确认身份或代表作时明确写“未核验”，不得猜测
        - 作者履历只用于判断研究积累和线索可信度，不能替代对当前论文方法、实验和证据的审核
  news_and_wechat:
    require_concrete_content: true
    separate_judgment: true
  department_implication_required: false

editorial_guidance:
  department_implication_required: false
  tone: >-
    沿用现有 OrbitInfer 周报的技术卡片骨架和信息密度，但先写具体内容，再写加粗的判断；
    论文补充技术领域、架构/模型、Workload/场景和自动识别关键词，之后再写问题、方法、
    结果、证据与局限。表达比论文摘要更口语化、直接，但不改成聊天记录，也不强制写部门启示。
    主周报不再按固定条数平均压缩：强相关内容完整展开，弱相关内容按层级和主题合并成短摘要；
    目标阅读时间约 10–12 分钟。所有相关论文仍要逐篇保留在调查索引中。
  item_structure:
    - 给出中文标题，并用一小段具体内容说明论文、新闻或公众号到底讲了什么
    - 具体内容之后再给出加粗的一句话判断，说明证据能支持什么、不能支持什么
    - 研究条目给出技术领域、架构/模型、Workload/场景和其他自动识别关键词
    - 已发表或已录用论文补充会议/期刊全称、领域层级、CCF 评级或有依据的对标判断
    - 仅有 arXiv 版本的论文补充核心作者单位、已核验身份、代表作和研究积累判断
    - 问题、方法和结果各用一句话交代，只保留理解结论所需的信息
    - 证据与局限合并为一条短说明，写清一手来源、适用条件和当前不能推出的结论
    - 强相关且证据充分的内容使用完整技术卡片，不因来源配额被压缩成一句话
    - 弱相关内容不逐条展开，按 L2/L3 和相近主题合并成一至数段摘要，并概括共同结论与差异
    - 主周报之外生成调查索引，为每条通过初筛的线索给出具体内容、L2/L3、来源类型、初审判断、关注级别、证据状态和原文链接
  required_checks:
    - 关键事实必须回到论文、官方项目、仓库、监管文件或正式公告核验
    - 区分实际结果、作者计划、研究假设和我们的推断
    - 论文关键词必须从摘要、Introduction、方法或正文提取，不能只看标题猜测
    - 发表状态必须从正式论文集、会议/期刊官网、DBLP、Crossref 或 OpenReview 交叉核验
    - CCF 评级注明所依据的目录；未收录时不得把主观对标写成正式评级
    - 作者单位、Fellow 身份和代表作必须核对可靠主页并排除同名作者
    - 相似论文可以合并成一个趋势判断，但每篇相关论文都必须单独进入调查索引
    - 合并弱相关内容时不得抹掉相互矛盾的结果；存在分歧时分别说明证据和适用条件
    - 同一事件的重复新闻和公众号报道合并为一个内容模块，但保留可核验的一手来源和必要的交叉来源
    - 使用 OrbitServe 最新四项 contribution，不沿用旧的 co-design 定位
    - 新闻只有在能改变研究判断时才进入周报
  avoid:
    - 不逐段复述摘要，不堆砌背景和术语
    - 不把遥感精度、纯训练或普通卫星路由包装成 ChatLLM Serving 近邻
    - 不根据标题猜测方法、结果、发表状态或开源情况
    - 不使用显著、最优、首次等词替代可核验的证据

