candidate_policy:
  allow_strong_new_preprints: true
  min_strong_new_preprint_relevance: 0.45
  # 强弱两档都严格使用同一自然周；弱档可以来自论文、公众号或新闻。
  min_supplemental_relevance: 0.25
  min_codex_brief_relevance: 0.25
  supplemental_section: related_updates_index
  read_minutes:
    accepted: 4.0
    important_revision: 2.0
    strong_new_preprint: 2.5
    authoritative_review: 1.5
    supplemental: 2.5

ranking:
  global_importance:
    venue_or_review_status: 0.20
    system_novelty: 0.20
    evidence_and_reproducibility: 0.20
    trend_signal: 0.15
    artifact_value: 0.15
    version_significance: 0.10

