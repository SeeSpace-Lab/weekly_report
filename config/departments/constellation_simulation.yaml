    reason: 可见性、链路、热、电池和 workflow SLO 联合调度的相邻基线
  - title: "Orbital Edge Computing: Nanosatellite Constellations as a New Class of Computer System"
    reason: 星座级物理仿真、能量与分布式处理流水线的系统基线
  - query: "Deciphering the Enigma of Satellite Computing with COTS Devices"
    reason: BUPT-1 实星能耗、温度、电池放电深度与弃能的校准证据
  - query: "The Unseen Cost of Space Computing battery aging"
    reason: 日照、放电深度、电池老化与任务调度耦合的物理约束基线
  - title: "When to Compute in Space"
    reason: 空天地计算位置选择、约束权重和工作负载适配性的 Characterization 参照
  - title: "Which Workloads Belong in Orbit?"
    reason: 判断工作负载何时适合上天的边界框架，防止泛化太空计算结论

news_watchlist:
  - organization: Google Project Suncatcher
    url: https://blog.google/technology/research/google-project-suncatcher
    collection_mode: automatic_rss
    reason: 关注 TPU 卫星网络、光链路、轨道构型和原型时间表是否改变 L2/L3 参数假设
  - organization: European Space Agency
    url: https://www.esa.int/Enabling_Support/Space_Engineering_Technology
    collection_mode: automatic_rss
    reason: 关注 cognitive cloud、在轨边缘计算、AI 硬件和相关研究计划
  - organization: Axiom Space Orbital Data Centers
    url: https://www.axiomspace.com/newsroom
    collection_mode: manual_official_page
    reason: 关注 AxODC 节点、光通信、硬件合作和实际部署节点，只采纳正式公告
  - organization: Starcloud
    url: https://www.starcloud.com/blog
    collection_mode: manual_official_page
    reason: 关注 Starcloud-1 后续在轨验证、计算载荷、能源散热假设和后续星座计划
  - organization: 国内计算卫星与在轨数据中心计划
    query: 计算卫星星座 在轨数据中心 太空计算 官方
    collection_mode: wechat_and_manual_verification
    reason: 先由固定中文来源发现线索，再回到任务方、研究机构或企业正式发布核验

