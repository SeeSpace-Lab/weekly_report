    - [SOSP, OSDI, NSDI, USENIX ATC, EuroSys]
    - [ISCA, MICRO, HPCA, ASPLOS]
    - [SIGCOMM, MobiCom]
  ccf_b_or_strong:
    - [SoCC, ICDCS, IPDPS, HPDC, SC]
    - [INFOCOM, SenSys, MobiSys]
    - [ICCAD, DATE]
  ml_systems_and_ai:
    - [MLSys, NeurIPS, ICML, ICLR, AAAI, IJCAI]
