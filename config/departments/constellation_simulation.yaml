    - [IEEE Aerospace Conference, AIAA SciTech, IAC]
    - [IEEE ICC, IEEE GLOBECOM, IEEE WCNC]
    - [IEEE Transactions on Aerospace and Electronic Systems]
    - [IEEE Journal on Selected Areas in Communications]
