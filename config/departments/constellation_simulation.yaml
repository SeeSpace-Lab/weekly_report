adjacent_topics:
  - 只有能改变 L2/L3 可行域、Compute Cell 组织或 OrbitServe 参数时才纳入轨道设计
  - 只有提供功率、SOC、热约束或生命周期成本证据时才纳入能源、散热与成本研究
  - 只有影响跨星执行或 Compute Cell 能力接口时才纳入 L1 推理引擎研究
  - L4 轨道面、倾角和相位主要用于理论定界与小范围敏感性，不作为全局搜索主体
  - 产业新闻必须能改变技术假设、实验计划或来源清单，普通融资和市场宣传不纳入

