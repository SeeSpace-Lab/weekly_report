content_requirements:
  require_content_and_judgment: true
  department_implication_required: false
  research_keyword_profile:
    required: true
    dimensions: [技术领域, 架构或模型, workload或应用场景, 系统约束]
    derive_from: [标题, 摘要, Introduction, 原始来源]
    title_only_inference_forbidden: true
  publication_context:
    published_paper: 说明会议或期刊全称、领域层级与 CCF 评级；无 CCF 时给出谨慎对标
    arxiv_preprint: 说明作者单位、已核验身份、代表作与研究积累，不把 arXiv comments 当作录用证明
  full_text_access:
    keep_in_index_when_unavailable: true
    unavailable_label: 待获取全文
    abstract_available_label: 待获取全文｜基于摘要初筛
    title_only_label: 待获取全文与摘要｜仅题目判断
    metadata_only_rule: 当前没有全文权限时，仍保留题目、作者、会议或期刊、发表时间、摘要、原文链接和相关性判断
    evidence_boundary: 只能依据已核验的题目和摘要介绍具体内容，不补写摘要中未披露的方法、实验结果或结论

editorial_guidance:
  item_structure:
    - 具体内容
    - 一句话判断
    - 关键词
    - 问题、方法与结果
    - 发表状态或作者背景
    - 证据与局限
  required_checks:
    - 公众号和新闻中的关键事实回到论文、官网或仓库核验
    - 强相关内容逐条展开，弱相关内容按主题合并
    - 所有论文候选在调查索引中保留题名和原文链接
    - 检索到但当前无法访问全文的论文标注“待获取全文”，不因权限不足从调查索引中删除
  avoid:
    - 只写判断、不交代原文具体内容
    - 根据标题猜测方法、结果或录用状态
    - 为凑篇数纳入泛化卫星通信或普通 AI 新闻

