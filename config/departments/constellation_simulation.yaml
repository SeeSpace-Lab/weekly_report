# 首批账号只是种子池，不是封闭白名单。新公众号完成 WeRSS 接入和来源核验后，
# 会被本部门自动纳入候选；未注册或无法确认账号主体的内容只能进入人工线索箱。
source_discovery:
  include_all_registered_wechat: true
  allow_new_sources: true
  seed_wechat_sources:
    - wechat_jiqizhixin
    - wechat_baai_hub
    - wechat_paperweekly
    - wechat_ai_frontline
    - wechat_oneflow
    - wechat_qbitai
    - wechat_aiera
    - wechat_ai_tech_review
    - wechat_xixiaoyao
    - wechat_datafuntalk
  admission_checks:
    - 确认公众号主体、历史文章质量和稳定更新能力
    - 完成 WeRSS 技术接入并在 config/sources.yaml 注册独立 source_id
    - 标注内容角色是论文解读、产业新闻、研究机构动态还是混合来源
    - 连续观察误报率；泛科技资讯或营销号不进入固定来源池

triage_policy:
  goal: 高召回形成调查池，主周报再做强凝练；不因内容早期或表述夸张而漏掉可能改变研究判断的线索
  high_impact_definition:
    - 直接挑战或重合 OrbitServe 最新四项 contribution
    - 给出会改变 L2/L3 拓扑、Runtime、仿真校准或 Cost-SLO 结论的新机制或量化结果
    - 由重要研究机构或企业正式宣布新的在轨算力计划、原型、合作或时间表
    - 出现反常识结果、数量级变化或可能改变实验基线的公开证据
  escalation_rules:
    - 高影响线索必须进入调查索引，即使证据尚不够进入主周报
    - 表述越劲爆，越要回到论文、官网、仓库或正式公告核验；未核验时明确标成“待核验线索”
    - 高影响且证据充分的条目优先进入主周报，不受普通来源配额挤压
    - 不能把标题党、融资宣传或二手转述本身当成高影响证据

investigation_index:
  enabled: true
  max_items: 30
  layers: [L2, L3]
  source_categories: [research, wechat, news]
  attention_levels: [high_impact, important, watch]
  evidence_statuses:
    - verified_primary
    - verified_official
    - secondary_only
    - unverified_claim
  include_all_main_report_items: true
  include_all_research_candidates: true
  research_assessment_fields:
    - publicationStatus
    - venueFullName
    - ccfRating
    - venueLevelAssessment
    - authorBackgroundForPreprint
    - representativeWorksForPreprint
    - assessmentEvidenceLinks
  purpose: 保留通过初审但未进入精读正文的相关线索，方便研究员按结论、层级和来源追踪原文

ranking:
  global_importance:
    venue_or_review_status: 0.20
    system_novelty: 0.20
    evidence_and_reproducibility: 0.20
    trend_signal: 0.15
    artifact_value: 0.15
    version_significance: 0.10

candidate_policy:
  allow_strong_new_preprints: true
  min_strong_new_preprint_relevance: 0.45
  read_minutes:
    accepted: 1.0
    important_revision: 1.0
    strong_new_preprint: 1.0
    artifact_release: 1.0
    authoritative_review: 1.0
    industry_update: 1.0
  min_codex_brief_relevance: 0.35

weekly_output:
  # develop 当前校验器允许最多 8 个正式条目；这里把额度优先留给强相关内容。
  # 弱相关线索不计作逐条技术卡片，而是进入 grouped_digest 和调查索引。
  target_read_minutes: 12
  max_items: 8
  max_wechat_items: 2
  section_limits:
    l2_news: 3
    l3_news: 3
  wechat_candidate_reserve: 10
  must_read_min: 2
  must_read_max: 4
  deep_read_min: 2
  deep_read_max: 4
  quick_scan_min: 0
  quick_scan_max: 0
  relevance_bands:
    strong_min: 0.65
    weak_min: 0.35
    below_weak: investigation_index_only
  presentation_policy:
    strong:
      mode: detailed_cards
      max_items: 8
      detail_level: 中文标题＋具体内容＋一句话判断＋关键词＋发表状态/venue或作者背景＋问题/方法/结果＋证据与局限
      selection_rule: 强相关且证据充分的内容优先逐条展开；高影响内容不受普通来源配额挤压
    weak:
      mode: grouped_digest
      group_by: [layer, topic]
      max_groups: 4
      max_source_refs_per_group: 8
      paragraph_guidance: 每组用一至数段说明这些工作共同在做什么、主要差异和当前可得出的判断
      publication_context_guidance: 每组保留最能影响可信度判断的 venue 或作者背景信息，逐篇详情进入调查索引
      keep_individual_titles_in_main: false
      preserve_individual_links_in_index: true
    high_impact_unverified:
      mode: short_alert_and_index
      guidance: 主周报只写待核验事实和为什么值得关注，不按已证实结果展开
  reading_budget:
    mode: soft_target
    target_range_minutes: [10, 12]
    allow_over_target_for_verified_high_impact: true
    overflow_rule: 普通弱相关内容继续合并；新增强相关内容不得仅为满足时长而删除
  grouped_by_layer: true
  section_routing:
    default_layer: L3
    wechat_news_keywords:
      - 宣布
      - 发布
      - 启动
      - 计划
      - 合作
      - 投资
      - 融资
      - 建成
      - 上线
      - announces
      - launch
      - partnership
    mapping:
      L2:
        research: l2_research
        wechat: l2_wechat
        news: l2_news
      L3:
        research: l3_research
        wechat: l3_wechat
        news: l3_news
  sections:
    - weekly_trends
    - must_read
    - l2_research
    - l2_wechat
    - l2_news
    - l3_research
    - l3_wechat
    - l3_news
  section_groups:
    - id: L2
      label: L2 · 密集编队与 Compute Cell
      sections: [l2_research, l2_wechat, l2_news]
    - id: L3
      label: L3 · Compute Cell 之间与 OrbitServe
      sections: [l3_research, l3_wechat, l3_news]
  section_labels:
    must_read: 本周优先关注
    l2_research: L2 层级对应论文
    l2_wechat: L2 · 国内微信公众号
    l2_news: L2 · 国内外新闻与研究计划
    l3_research: L3 层级对应论文
    l3_wechat: L3 · 国内微信公众号
    l3_news: L3 · 国内外新闻与研究计划

activation_requirements:
  - 用户确认 L2/L3 为主体、L4 为理论定界和扩展
  - 用户已确认沿用 OrbitInfer 技术卡片结构，并允许表达稍微更口语化
  - L2/L3 各自按研究、国内公众号、国内外新闻与计划组织
  - 主周报之外生成带初审结论和原文链接的调查索引
  - 内容负责人和 GitHub 审核团队已确认
  - 产业新闻首版使用人工投递，或官方新闻采集器已完成接入
  - 部门配置、候选导出、Python 测试和站点构建全部通过
