activation_requirements:
  - 用户确认 L2/L3 为主体、L4 为理论定界和扩展
  - 用户已确认沿用 OrbitInfer 技术卡片结构，并允许表达稍微更口语化
  - L2/L3 各自按研究、国内公众号、国内外新闻与计划组织
  - 主周报之外生成带初审结论和原文链接的调查索引
  - 内容负责人和 GitHub 审核团队已确认
  - 产业新闻首版使用人工投递，或官方新闻采集器已完成接入
