paper_watchlist:
  - title: Communication-Efficient Collaborative LLM Inference over LEO Satellite Networks
    reason: L2 多星模型切分、流水并行和通信压缩的直接近邻
  - title: Designing Dense Satellite Clusters for Distributed Space-based Datacenters
    reason: L2 密集编队、持续可用 ISL 和数据中心拓扑设计的直接近邻
  - title: On an Ultra-Dense LEO-Satellite-Based Computing Network Constellation Design
    reason: 面向地区计算需求的计算星座构型设计近邻
  - title: Krios Scheduling Abstractions and Mechanisms for Enabling a LEO Compute Cloud
    reason: 移动服务区、实例预部署和状态交接的 L3 Runtime 近邻
  - title: Orbital Edge Computing Nanosatellite Constellations as a New Class of Computer System
    reason: 星座级物理仿真、能量与分布式处理流水线的系统基线
  - title: Which Workloads Belong in Orbit
    reason: 判断工作负载何时适合上天的边界框架
  - title: Orbital Data Centers Spacecraft Constraints and Economic Viability
    reason: 功率、散热、通信与成本约束的量化参考

venue_scope:
  # CCF 级别用于辅助判断，不作为硬过滤条件；强相关的航天权威 venue 同样纳入。
