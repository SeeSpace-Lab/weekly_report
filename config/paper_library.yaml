version: "0.1"
department_id: orbitinfer
policy:
  rolling_years: 2
  famous_exceptions_allowed: true
  official_venue_source_required: true
  interpretation_is_attachment: true

papers:
  - id: vllm_sosp23
    title: "Efficient Memory Management for Large Language Model Serving with PagedAttention"
    title_zh: "vLLM：用 PagedAttention 重构大模型推理的显存管理"
    venue: "SOSP 2023"
    year: 2023
    topic: inference_runtime
    famous_exception: true
    status: "顶会论文 · 领域奠基"
    url: "https://dl.acm.org/doi/10.1145/3600006.3613165"
    code_url: "https://github.com/vllm-project/vllm"
    one_sentence_zh: "把 KV Cache 切成可按需映射的块，减少显存碎片和重复占用，成为现代 LLM Serving 的基础内存抽象。"
    why_it_matters_zh: "后续连续批处理、调度和 KV Cache 分层工作大多以它为系统基线，虽然超出两年窗口，仍作为著名论文保留。"

  - id: sarathi_serve_osdi24
    title: "Taming Throughput-Latency Tradeoff in LLM Inference with Sarathi-Serve"
    title_zh: "Sarathi-Serve：用分块 Prefill 缓和吞吐与时延冲突"
    venue: "OSDI 2024"
    year: 2024
    topic: inference_scheduling
    status: "顶会论文"
    url: "https://www.usenix.org/conference/osdi24/presentation/agrawal"
    code_url: "https://github.com/microsoft/sarathi-serve"
    one_sentence_zh: "将长 Prefill 切块并与 Decode 组成更均匀的批次，在不长时间阻塞解码的前提下提高 GPU 利用率。"
    why_it_matters_zh: "它直接对应动态负载下的推理调度，是分析功率预算变化时如何调整批次和阶段执行的重要基线。"

  - id: infinigen_osdi24
    title: "InfiniGen: Efficient Generative Inference of Large Language Models with Dynamic KV Cache Management"
    title_zh: "InfiniGen：只预取下一步真正需要的 KV Cache"
    venue: "OSDI 2024"
    year: 2024
    topic: kv_cache
    status: "顶会论文"
    url: "https://www.usenix.org/conference/osdi24/presentation/lee"
    code_url:
    one_sentence_zh: "通过轻量预演预测下一层需要关注的 token，只从主机侧预取关键 KV 条目，降低卸载式推理的数据搬运。"
    why_it_matters_zh: "对存储和带宽受限平台尤其有参考价值，核心问题是以少量额外计算换取更低的 KV 传输压力。"

  - id: llumnix_osdi24
    title: "Llumnix: Dynamic Scheduling for Large Language Model Serving"
    title_zh: "Llumnix：通过请求活迁移实现动态推理调度"
    venue: "OSDI 2024"
    year: 2024
    topic: inference_scheduling
    status: "顶会论文"
    url: "https://www.usenix.org/conference/osdi24/presentation/sun-biao"
    code_url: "https://github.com/AlibabaPAI/llumnix"
    one_sentence_zh: "像操作系统迁移进程一样迁移请求及其 KV 状态，以持续处理负载不均、显存碎片、优先级和扩缩容。"
    why_it_matters_zh: "提供了运行时自适应调度的完整系统范式，可映射到动态功率预算下的实例迁移和服务等级控制。"

  - id: distserve_osdi24
    title: "DistServe: Disaggregating Prefill and Decoding for Goodput-optimized Large Language Model Serving"
    title_zh: "DistServe：分离 Prefill 与 Decode 的 Goodput 优化服务"
    venue: "OSDI 2024"
    year: 2024
    topic: distributed_inference
    status: "顶会论文"
    url: "https://www.usenix.org/conference/osdi24/presentation/zhong-yinmin"
    code_url: "https://github.com/LLMServe/DistServe"
    one_sentence_zh: "把 Prefill 和 Decode 放到不同 GPU，并围绕 TTFT、TPOT 约束分别配置并行策略和资源。"
    why_it_matters_zh: "是解耦式推理和阶段级资源编排的代表工作，可用于比较星载异构算力或动态功率分区方案。"

  - id: serverlessllm_osdi24
    title: "ServerlessLLM: Low-Latency Serverless Inference for Large Language Models"
    title_zh: "ServerlessLLM：面向低冷启动时延的多级模型加载与迁移"
    venue: "OSDI 2024"
    year: 2024
    topic: storage_and_migration
    status: "顶会论文"
    url: "https://www.usenix.org/conference/osdi24/presentation/fu"
    code_url: "https://github.com/ServerlessLLM/ServerlessLLM"
    one_sentence_zh: "利用 GPU 邻近存储保存检查点，结合加载优化格式、分层加载和活迁移降低大模型实例启动时延。"
    why_it_matters_zh: "连接了分层存储、模型迁移和调度，对存储层次复杂且需要快速切换任务的受限平台具有借鉴意义。"

  - id: punica_mlsys24
    title: "Punica: Multi-Tenant LoRA Serving"
    title_zh: "Punica：共享基础模型的多租户 LoRA 推理服务"
    venue: "MLSys 2024"
    year: 2024
    topic: inference_runtime
    status: "顶会论文"
    url: "https://proceedings.mlsys.org/paper_files/paper/2024/hash/054de805fcceb78a201f5e9d53c85908-Abstract-Conference.html"
    code_url: "https://github.com/punica-ai/punica"
    one_sentence_zh: "通过面向多适配器批处理的 GPU Kernel 和调度器，让多个 LoRA 租户共享同一份基础模型权重。"
    why_it_matters_zh: "展示了细粒度模型变体共享与请求编排方式，可支持多任务载荷在有限显存中的快速切换。"

  - id: mooncake_fast25
    title: "Mooncake: Trading More Storage for Less Computation — A KVCache-centric Architecture for Serving LLM Chatbot"
    title_zh: "Mooncake：以分布式 KV Cache 换取更少重复计算"
    venue: "FAST 2025"
    year: 2025
    topic: kv_cache
    status: "Best Paper"
    url: "https://www.usenix.org/conference/fast25/presentation/qin"
    code_url: "https://github.com/kvcache-ai/Mooncake"
    one_sentence_zh: "围绕全局分布式 KV Cache 组织 Prefill/Decode 分离架构，利用 CPU、DRAM、SSD 和网络减少重复计算。"
    why_it_matters_zh: "把 KV Cache 提升为系统级资源，适合用于思考存储、通信、功耗和计算之间的跨层权衡。"

